services:
  servico:
    build:
      context: .
      dockerfile: docker/Dockerfile.servico
    environment:
      PORT: "3000"
      PORT_INTERNA: "3001"
      CONFIG_PATH: /dados/config/empresa.json
      PROMPT_PATH: /dados/prompts/agente.md
      CHAT_PATH: /dados/chat/index.html
      LP_PATH: /dados/chat/lp.html
      LOGO_PATH: /dados/chat/logo.svg
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/chat
      DEMO_PAINEL: ${DEMO_PAINEL:-0}
      LIMITE_POR_MINUTO: ${LIMITE_POR_MINUTO:-20}
      DADOS_DIR: /dados/estado
      ALERTA_CANAL: ${ALERTA_CANAL:-simulado}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-}
      ALERTA_EMAIL_DE: ${ALERTA_EMAIL_DE:-}
      ALERTA_EMAIL_PARA: ${ALERTA_EMAIL_PARA:-}
    ports:
      - "127.0.0.1:8080:3000"
    volumes:
      - ./config:/dados/config:ro
      - ./prompts:/dados/prompts:ro
      - ./chat:/dados/chat:ro
      # Contagem de falhas e alertas, sem texto de conversa.
      - dados-servico:/dados/estado
    mem_limit: 128m

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.4
    entrypoint: ["/bin/sh", "/docker/n8n-entrypoint.sh"]
    depends_on:
      - servico
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?preencha a chave no arquivo .env}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      SERVICO_URL: http://servico:3001
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      # Retenção da spec 001 (30 dias). Sem volume, derrubar o Compose apaga tudo.
      EXECUTIONS_DATA_MAX_AGE: "720"
      # Acima do orçamento do turno, ia.timeout_turno_ms (180 s), para o serviço decidir antes do n8n cortar.
      EXECUTIONS_TIMEOUT: "240"
      EXECUTIONS_TIMEOUT_MAX: "300"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ./n8n:/workflow:ro
      - ./docker/n8n-entrypoint.sh:/docker/n8n-entrypoint.sh:ro
    # DNS explícito: o resolvedor do Docker pode falhar quando o host usa o systemd-resolved.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 768m

  # Modelo simulado: ANTHROPIC_BASE_URL=http://stub:8787 docker compose --profile teste up
  # Com a config real (ia.modelo_reserva vazio, spec 007), STUB_CENARIO=reserva_ok dá 3 × 503 e silêncio;
  # a reserva só responde (teste T11 da spec 002) com ia.modelo_reserva = claude-sonnet-5-5.
  stub:
    image: node:24-alpine
    profiles: ["teste"]
    command: ["node", "/stub/stub-api.mjs"]
    environment:
      STUB_CENARIO: ${STUB_CENARIO:-padrao}
    volumes:
      - ./scripts/stub-api.mjs:/stub/stub-api.mjs:ro
    mem_limit: 64m

volumes:
  dados-servico:
