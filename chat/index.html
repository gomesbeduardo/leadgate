<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento CentralEng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --msg-topo: #1d5c47;
  --msg-topo-texto: #ffffff;
  --msg-fundo: #e3ece1;
  --msg-agente: #ffffff;
  --msg-lead: #cdeec2;
  --msg-acento: #226e4c;
  --msg-acento-escuro: #1a5a3d;
  --msg-aviso: #fff8d6;
  --msg-aviso-borda: #d9c86a;
  --msg-borda: #b3c7b8;
  --msg-hora: #56655b;
  --nevoa-pagina: #f3f5f8;
  --branco: #ffffff;
  --grafite: #515a6e;
  --tinta: #171b24;
  --fonte-titulo: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --fonte-texto: 'Mukta', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --raio: 8px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 16px/1.5 var(--fonte-texto);
  color: var(--tinta);
  background: var(--msg-fundo);
  overflow-x: hidden;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 3px solid var(--msg-acento); outline-offset: 2px; }

.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; min-height: 0; }
.topo { background: var(--msg-topo); color: var(--msg-topo-texto); padding: 8px 12px; display: flex; align-items: center; gap: 10px; }
.voltar { color: var(--msg-topo-texto); text-decoration: none; font-size: 1.75rem; line-height: 1; width: 32px; height: 44px; display: flex; align-items: center; justify-content: center; }
.voltar:focus-visible { outline-color: var(--msg-topo-texto); }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--branco); color: var(--msg-topo); display: flex; align-items: center; justify-content: center; }
.avatar i { display: block; width: 28px; height: 16px; background: currentColor; -webkit-mask: url(/logo.svg) center / contain no-repeat; mask: url(/logo.svg) center / contain no-repeat; }
.topo h1 { margin: 0; font: 600 1.25rem/1.2 var(--fonte-titulo); letter-spacing: .01em; }
.topo p { margin: 0; font-size: .8125rem; line-height: 1.2; opacity: .85; }
.corpo { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; }
body.com-painel .corpo { max-width: none; flex-direction: column; }
.coluna { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; background: var(--msg-fundo); }

.conversa { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { position: relative; max-width: 82%; padding: 6px 10px 4px; border-radius: var(--raio); overflow-wrap: anywhere; box-shadow: 0 1px 0 var(--msg-borda); }
.msg .texto { white-space: pre-wrap; }
.msg .hora { display: block; text-align: right; font-size: .6875rem; line-height: 1.3; color: var(--msg-hora); margin-top: 2px; }
.msg.sistema { align-self: flex-start; background: var(--msg-agente); color: var(--tinta); border-top-left-radius: 0; }
.msg.lead { align-self: flex-end; background: var(--msg-lead); color: var(--tinta); border-top-right-radius: 0; }
.msg.aviso { align-self: center; max-width: 92%; background: var(--msg-aviso); border: 1px solid var(--msg-aviso-borda); color: var(--tinta); font-size: .875rem; text-align: center; padding: 8px 12px; }
.msg.aviso .rotulo { display: block; font: 600 .75rem/1.2 var(--fonte-titulo); text-transform: uppercase; letter-spacing: .08em; color: var(--grafite); margin-bottom: 4px; }
.encerrado { align-self: center; font-size: .8125rem; color: var(--msg-hora); background: var(--msg-agente); border-radius: var(--raio); padding: 4px 12px; }

.digitando { align-self: flex-start; display: flex; align-items: center; gap: 10px; background: var(--msg-agente); color: var(--grafite); font-size: .875rem; padding: 6px 12px; border-radius: var(--raio); border-top-left-radius: 0; }
.digitando[hidden] { display: none; }
.pontos { display: inline-flex; gap: 4px; }
.pontos i { width: 7px; height: 7px; background: var(--msg-acento); border-radius: 50%; display: block; animation: pulso 1.2s ease-in-out infinite; }
.pontos i:nth-child(2) { animation-delay: .15s; }
.pontos i:nth-child(3) { animation-delay: .3s; }
@keyframes pulso { 0%, 80%, 100% { opacity: .25; transform: scale(.7); } 40% { opacity: 1; transform: scale(1.1); } }

.rodape { flex: none; background: var(--nevoa-pagina); padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
form { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; min-width: 0; resize: none; font: inherit; color: var(--tinta); background: var(--branco);
  border: 1px solid var(--msg-borda); border-radius: 22px; padding: 9px 16px; max-height: 8.5em;
}
textarea:disabled { background: var(--nevoa-pagina); color: var(--grafite); }
button {
  font: 600 1rem/1 var(--fonte-titulo); letter-spacing: .03em; min-height: 44px; padding: 0 20px;
  border-radius: 22px; border: 1px solid var(--msg-acento); background: var(--msg-acento); color: var(--branco); cursor: pointer;
}
button:hover:not(:disabled) { background: var(--msg-acento-escuro); border-color: var(--msg-acento-escuro); }
button:disabled { background: var(--msg-borda); border-color: var(--msg-borda); color: var(--grafite); cursor: not-allowed; }
button.secundario { background: var(--branco); color: var(--msg-acento); }
button.secundario:hover:not(:disabled) { background: var(--msg-lead); color: var(--msg-acento-escuro); }
.nova { display: flex; justify-content: center; }
.nova[hidden] { display: none; }

.painel { display: none; background: var(--nevoa-pagina); border-top: 1px solid var(--msg-borda); padding: 16px; overflow: auto; max-height: 40vh; }
body.com-painel .painel { display: block; }
.painel h2 { margin: 0 0 8px; font: 600 1.125rem/1.2 var(--fonte-titulo); color: var(--msg-topo); }
.painel dl { margin: 0 0 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: .875rem; }
.painel dt { color: var(--grafite); }
.painel dd { margin: 0; font-weight: 600; }
.painel pre { margin: 0; padding: 10px; background: var(--branco); border: 1px solid var(--msg-borda); border-radius: var(--raio); font: .8125rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.painel .vazio { color: var(--grafite); font-size: .875rem; margin: 0; }

@media (min-width: 900px) {
  body.com-painel .corpo { flex-direction: row; }
  body.com-painel .coluna { max-width: none; margin: 0; flex: 1 1 60%; }
  body.com-painel .painel { flex: 0 0 380px; max-height: none; border-top: 0; border-right: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .pontos i { animation: none; opacity: .7; }
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <a class="voltar" href="/" aria-label="Voltar para o início">&#8249;</a>
    <span class="avatar" aria-hidden="true"><i></i></span>
    <div><h1>Atendimento CentralEng</h1><p>Assistente virtual</p></div>
  </header>
  <div class="corpo">
    <main class="coluna">
      <div class="conversa" id="conversa" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversa"></div>
      <div class="rodape">
        <div class="nova" id="nova" hidden><button type="button" id="btn-nova" class="secundario">Nova conversa</button></div>
        <form id="form" autocomplete="off">
          <label class="sr-only" for="entrada">Sua mensagem</label>
          <textarea id="entrada" rows="1" maxlength="2000" aria-label="Sua mensagem" placeholder="Escreva sua mensagem" enterkeyhint="send"></textarea>
          <button type="submit" id="enviar">Enviar</button>
        </form>
      </div>
    </main>
    <aside class="painel" id="painel" aria-labelledby="painel-titulo">
      <h2 id="painel-titulo">O que o sistema decidiu</h2>
      <dl>
        <dt>Próxima ação</dt><dd id="p-acao">-</dd>
        <dt>Estado</dt><dd id="p-estado">-</dd>
        <dt>Tipo</dt><dd id="p-tipo">-</dd>
        <dt>Tentativas</dt><dd id="p-tent">-</dd>
      </dl>
      <p class="vazio" id="p-vazio">Aparece depois da primeira resposta.</p>
      <pre id="p-saida" hidden></pre>
    </aside>
  </div>
</div>
<div class="sr-only" id="status" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var conversa = $('conversa'), entrada = $('entrada'), enviar = $('enviar'), form = $('form');
  var nova = $('nova'), status = $('status');
  var painel = new URLSearchParams(location.search).get('painel') === '1';
  if (painel) document.body.classList.add('com-painel');

  var tela = { titulo: 'Atendimento', aviso_lgpd: '' };
  var historico = [];
  var aguardando = false;
  var encerrada = false;
  var digitando = null;
  var timers = [];

  function el(tag, classe, texto) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }
  function rolar() { conversa.scrollTop = conversa.scrollHeight; }
  function hora() {
    var d = new Date();
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function adicionar(classe, texto) {
    var m = el('div', 'msg ' + classe);
    m.appendChild(el('span', 'texto', texto));
    m.appendChild(el('span', 'hora', hora()));
    conversa.appendChild(m);
    rolar();
    return m;
  }
  function mostrarAviso() {
    if (!tela.aviso_lgpd) return;
    var m = el('div', 'msg aviso');
    m.appendChild(el('span', 'rotulo', 'Aviso'));
    m.appendChild(document.createTextNode(tela.aviso_lgpd));
    conversa.appendChild(m);
  }
  function atualizarControles() {
    var bloqueado = aguardando || encerrada;
    entrada.disabled = bloqueado;
    enviar.disabled = bloqueado;
    nova.hidden = !encerrada;
    form.hidden = encerrada;
  }
  function ajustarAltura() {
    entrada.style.height = 'auto';
    entrada.style.height = Math.min(entrada.scrollHeight, 136) + 'px';
  }

  var frases = ['Lendo sua mensagem...', 'Analisando o que você contou...', 'Ainda trabalhando na resposta...'];
  function iniciarEspera() {
    digitando = el('div', 'digitando');
    var p = el('span', 'pontos');
    p.setAttribute('aria-hidden', 'true');
    p.appendChild(el('i')); p.appendChild(el('i')); p.appendChild(el('i'));
    var t = el('span', null, frases[0]);
    digitando.appendChild(p);
    digitando.appendChild(t);
    conversa.appendChild(digitando);
    rolar();
    status.textContent = 'Preparando a resposta.';
    timers.push(setTimeout(function () { t.textContent = frases[1]; }, 3500));
    timers.push(setTimeout(function () { t.textContent = frases[2]; }, 8000));
  }
  function encerrarEspera() {
    timers.forEach(clearTimeout); timers = [];
    if (digitando && digitando.parentNode) digitando.parentNode.removeChild(digitando);
    digitando = null;
    status.textContent = '';
  }

  function atualizarPainel(d) {
    if (!painel) return;
    $('p-acao').textContent = d.proxima_acao == null ? '-' : String(d.proxima_acao);
    $('p-estado').textContent = d.estado == null ? '-' : String(d.estado);
    $('p-tipo').textContent = d.tipo == null ? '-' : String(d.tipo);
    $('p-tent').textContent = d.tentativas == null ? '-' : String(d.tentativas);
    var pre = $('p-saida');
    if (d.saida !== undefined && d.saida !== null) {
      pre.textContent = JSON.stringify(d.saida, null, 2);
      pre.hidden = false;
      $('p-vazio').hidden = true;
    } else {
      pre.hidden = true;
      $('p-vazio').hidden = false;
      $('p-vazio').textContent = 'Sem saída estruturada nesta resposta.';
    }
  }

  async function enviarMensagem(texto) {
    historico.push({ role: 'user', content: texto });
    adicionar('lead', texto);
    aguardando = true;
    atualizarControles();
    iniciarEspera();
    var d;
    try {
      var r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ historico: historico })
      });
      d = await r.json();
    } catch (e) {
      d = null;
    }
    encerrarEspera();
    // Silencio: sem resposta nao ha bolha nem texto de erro; a mensagem do lead fica e o campo segue livre.
    var resposta = d && typeof d.resposta === 'string' && d.resposta ? d.resposta : null;
    if (resposta) {
      historico.push({ role: 'assistant', content: resposta });
      adicionar('sistema', resposta);
    }
    atualizarPainel(d || {});
    var acao = d && d.proxima_acao;
    if (resposta && acao !== undefined && acao !== null && acao !== 'perguntar') {
      encerrada = true;
      conversa.appendChild(el('div', 'encerrado', 'Atendimento encerrado'));
      rolar();
    }
    aguardando = false;
    atualizarControles();
    if (!encerrada) entrada.focus(); else $('btn-nova').focus();
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var texto = entrada.value.trim();
    if (!texto || aguardando || encerrada) return;
    entrada.value = '';
    ajustarAltura();
    enviarMensagem(texto);
  });
  entrada.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      form.requestSubmit();
    }
  });
  entrada.addEventListener('input', ajustarAltura);

  function reiniciar() {
    historico = [];
    aguardando = false;
    encerrada = false;
    conversa.textContent = '';
    mostrarAviso();
    atualizarPainel({});
    if (painel) { $('p-vazio').textContent = 'Aparece depois da primeira resposta.'; $('p-vazio').hidden = false; $('p-saida').hidden = true; }
    atualizarControles();
    entrada.focus();
  }
  $('btn-nova').addEventListener('click', reiniciar);

  fetch('/tela.json').then(function (r) { return r.json(); }).then(function (c) {
    tela = c;
  }).catch(function () {}).then(function () {
    mostrarAviso();
    atualizarControles();
    entrada.focus();
  });
})();
</script>
</body>
</html>
